spring:
  application:
    name: transactions
  datasource:
    url: ${TRANSACTIONS_DB_URL:jdbc:postgresql://localhost:5433/payflow_transactions}
    username: ${TRANSACTIONS_DB_USER:payflow}
    password: ${TRANSACTIONS_DB_PASSWORD:payflow}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8082

accounts:
  service:
    base-url: ${ACCOUNTS_SERVICE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
